<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>threejs-video</title>
  <style>
    html, body { margin: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
  <!-- Fonts: bundle locally (npm @fontsource/<family>) so renders never depend on the network. -->
  <link rel="stylesheet" href="../node_modules/@fontsource/inter/latin-700.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/inter/latin-900.css">
  <!-- The last entry redirects TTFLoader's CDN import of opentype.js to the local copy, so 3D text works offline. -->
  <script type="importmap">
    { "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/",
        "https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/+esm": "../node_modules/opentype.js/dist/opentype.module.js"
    } }
  </script>
</head>
<body>
  <script type="module" src="./main.js"></script>
</body>
</html>
